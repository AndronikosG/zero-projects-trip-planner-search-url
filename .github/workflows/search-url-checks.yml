name: Search URL checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/runtime-cache-evidence.mjs
      - run: npm run build

      - name: Install Playwright for acceptance run
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run browser acceptance — first pass
        shell: bash
        run: |
          npm run dev > first-pass-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
          set +e
          EVIDENCE_RUN=first-pass node scripts/browser-acceptance.mjs
          ACCEPTANCE_STATUS=$?
          set -e
          echo "----- first-pass-server.log -----"
          cat first-pass-server.log
          if [ -d evidence/search-url/first-pass ]; then
            cp first-pass-server.log evidence/search-url/first-pass/server.log
          fi
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true
          trap - EXIT
          exit $ACCEPTANCE_STATUS

      - name: Run browser acceptance — final rerun
        shell: bash
        run: |
          npm run dev > final-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://localhost:3000 >/dev/null; then break; fi
            sleep 1
          done
          EVIDENCE_RUN=final node scripts/browser-acceptance.mjs
          cp final-server.log evidence/search-url/final/server.log
          kill $SERVER_PID || true
          wait $SERVER_PID 2>/dev/null || true
          trap - EXIT

      - name: Add failure/re-run note
        shell: bash
        run: |
          cat > ACCEPTANCE_FAILURES_AND_RERUNS.md <<'EOF'
          # Acceptance failures and re-runs

          ## Failure 1 — browser Back would not have a previous filter entry

          Before the acceptance run, browser-history review found that filter edits used `router.replace`. That updated the URL without reload, but replaced the current history entry.

          **Cause:** filter state changes used replacement navigation.

          **Fix:** changed filter updates to `router.push(..., { scroll: false })`, so browser Back can restore the previous normalized search state while still avoiding a full reload.

          ## Failure 2 — first automated browser run never reached results

          The first CI browser attempt timed out on the cold-load row. The page rendered the controls and URL strip but stayed on `Loading accommodation…`. The server log showed Next.js blocking development resources because the harness opened `127.0.0.1` while the dev server was serving `localhost`.

          **Cause:** acceptance-harness origin mismatch, not search URL logic.

          **Fix:** changed the browser base URL and readiness probe to `http://localhost:3000`, matching the Next.js dev origin.

          ## Re-run evidence

          `ACCEPTANCE_EVIDENCE_FIRST_PASS.md` and `evidence/search-url/first-pass/` contain the first complete browser pass after both fixes. `ACCEPTANCE_EVIDENCE.md` and `evidence/search-url/final/` contain a clean rerun of the same matrix. Every row includes the exact `/api/search` request count and a screenshot.
          EOF

      - name: Commit acceptance record and screenshots
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ACCEPTANCE_EVIDENCE.md ACCEPTANCE_EVIDENCE_FIRST_PASS.md ACCEPTANCE_FAILURES_AND_RERUNS.md evidence/search-url
          if git diff --cached --quiet; then
            echo "No acceptance evidence changes to commit."
          else
            git commit -m "Add final shareable search acceptance evidence"
            git push origin HEAD:main
          fi
